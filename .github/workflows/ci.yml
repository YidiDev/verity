name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Audit dependencies
        run: yarn npm audit --all --recursive --severity moderate

  check:
    name: Typecheck, Lint, Build & Test
    runs-on: ubuntu-latest
    needs: audit
    strategy:
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn vitest run

      - name: Verify dist output
        run: |
          for file in \
            dist/core.mjs \
            dist/core.umd.js \
            dist/core.cjs \
            dist/core/index.d.ts \
            dist/core/index.d.cts \
            dist/adapters/alpine.mjs \
            dist/adapters/alpine.umd.js \
            dist/adapters/alpine.cjs \
            dist/adapters/alpine.d.ts \
            dist/adapters/alpine.d.cts \
            dist/adapters/react.mjs \
            dist/adapters/react.umd.js \
            dist/adapters/react.cjs \
            dist/adapters/react.d.ts \
            dist/adapters/react.d.cts \
            dist/adapters/vue.mjs \
            dist/adapters/vue.umd.js \
            dist/adapters/vue.cjs \
            dist/adapters/vue.d.ts \
            dist/adapters/vue.d.cts \
            dist/adapters/svelte.mjs \
            dist/adapters/svelte.umd.js \
            dist/adapters/svelte.cjs \
            dist/adapters/svelte.d.ts \
            dist/adapters/svelte.d.cts \
            dist/devtools/devtools.mjs \
            dist/devtools/devtools.umd.js \
            dist/devtools/devtools.cjs \
            dist/devtools/index.d.ts \
            dist/devtools/index.d.cts \
            dist/devtools/devtools.css
          do
            test -f "$file" || (echo "Missing $file" && exit 1)
          done
          echo "All expected build outputs present"

      - name: Verify packed package
        run: yarn verify:package

      - name: Upload build artifacts
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
