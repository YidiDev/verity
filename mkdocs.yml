site_name: Verity
site_description: "Server-truth data layer for calm UI"
site_url: https://verity.yidi.sh
repo_url: https://github.com/YidiDev/verity
repo_name: YidiDev/verity

copyright: Copyright &copy; 2025 Yidi Sprei

nav:
  - Home: index.md
  - Why Verity?: why-verity.md
  - Philosophy: philosophy.md
  - Architecture: architecture.md
  - Core Concepts:
      - Truth vs View State: concepts/truth-vs-view-state.md
      - Directives: concepts/directives.md
      - Levels & Conversions: concepts/levels-and-conversions.md
      - Concurrency Model: concepts/concurrency-model.md
  - Getting Started:
      - Quick Start: guides/getting-started.md
      - State Model: guides/state-model.md
      - UX Patterns: guides/ux-patterns.md
  - Migration:
      - From TanStack Query: migration/from-tanstack-query.md
      - From Apollo: migration/from-apollo.md
      - From htmx: migration/from-htmx.md
  - Reference:
      - Core API: reference/core.md
      - Framework Adapters: reference/adapters.md
      - Directive Contract: reference/directives.md
      - Devtools: reference/devtools.md
  - Examples: examples.md
  - Glossary: glossary.md
  - FAQ: faq.md
  - Contributing: contributing.md
theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select

    # - content.footnote.tooltips
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes

    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
    - header.autohide
    - announce.dismiss
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo

      accent: indigo

      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - git-committers:
      repository: YidiDev/Verity
      branch: main
  - git-authors
  - privacy
  - optimize
  - offline
  - blog
  - social
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all

  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:

        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde


extra:
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  status:
    new: Recently added
    deprecated: Deprecated
  generator: false
  analytics:
    provider: google
    property: G-E3T2VSPJTZ
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://github.com/YidiDev/verity/issues/new?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">feedback form</a>.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YidiDev
    - icon: fontawesome/solid/paper-plane
      link: mailto:yididev@gmail.com

edit_uri: edit/main/docs/
